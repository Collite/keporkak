# One entry per office (contracts.md §9; values: plan.md §4.1, D-46). v1 has one office: Panda until 2026-11-24, then
# dsk (the homelab's host swap D8a: panda becomes a household server). The daemon takes its office from the short host
# name, so dsk needs its own entry: the same values, same user, same paths under ~. `panda` stays while the specs
# name it (DaemonSupport.OFFICE and the Python tests); removing it is a later stage's.
# `~` is the office user's home. `hand` is reserved for hand-recorded lines and is never an office (contracts.md §1).
version: 1
offices:
  panda:
    os: linux
    # Under D-19 every seat runs as Bora's OS user; the split is v1.1's first item (D-46).
    user: bora
    roots:
      worktrees: ~/Dev/keporkak/_wt
      scratch: ~/Dev/_scratch
      # the seats' config homes, one per seat
      seats: ~/.local/share/keporkak/seats
      # mode 0700; its files 0600 (architecture.md §4)
      secrets: ~/.config/keporkak/secrets
    # One project checkout, a folder per effort relative to it (the toy's plan is under toy/); `mail/` is at its root.
    project: {checkout: ~/Dev/keporkak/project, efforts: {KP: ".", TOY: toy}}
    repos: {keporkak: ~/Dev/keporkak/keporkak, kp-toy: ~/Dev/keporkak/kp-toy}
    live_targets: [bp-dsk]
    # A | B | C | off
    computer_use: "off"
    qa: {vendor: claude}
    listen: {mcp: "127.0.0.1:7711", board: "127.0.0.1:7712"}
    # How often the daemon reports the facts of its seats with a turn in flight (contracts.md §9, Amendment 22).
    watch: {every: 30s}
  dsk:
    os: linux
    # Under D-19 every seat runs as Bora's OS user; the split is v1.1's first item (D-46).
    user: bora
    roots:
      worktrees: ~/Dev/keporkak/_wt
      scratch: ~/Dev/_scratch
      # the seats' config homes, one per seat
      seats: ~/.local/share/keporkak/seats
      # mode 0700; its files 0600 (architecture.md §4)
      secrets: ~/.config/keporkak/secrets
    # One project checkout, a folder per effort relative to it (the toy's plan is under toy/); `mail/` is at its root.
    project: {checkout: ~/Dev/keporkak/project, efforts: {KP: ".", TOY: toy}}
    repos: {keporkak: ~/Dev/keporkak/keporkak, kp-toy: ~/Dev/keporkak/kp-toy}
    live_targets: [bp-dsk]
    # A | B | C | off
    computer_use: "off"
    qa: {vendor: claude}
    listen: {mcp: "127.0.0.1:7711", board: "127.0.0.1:7712"}
    # How often the daemon reports the facts of its seats with a turn in flight (contracts.md §9, Amendment 22).
    watch: {every: 30s}
# GitHub (contracts.md §9, Amendment 33): the organization, each App's id and its installation's id, and which App a
# role acts as with which permissions (D-38). None of it is a secret; the keys are, and they are only on the office.
github:
  organization: Collite
  apps:
    kp-merger: {app: 5849229, installation: 184045472}
    kp-coder: {app: 5849303, installation: 184046595}
    kp-reviewer: {app: 5849353, installation: 184047637}
    kp-gardener: {app: 5849393, installation: 184048423}
  seats:
    coder: {app: kp-coder, permissions: {contents: write, pull_requests: write}}
    reviewer: {app: kp-reviewer, permissions: {contents: read, pull_requests: write, checks: read}}
    gardener: {app: kp-gardener, permissions: {issues: write, pull_requests: read, contents: read}}
    principal: {app: kp-reviewer, permissions: {contents: read, pull_requests: read}}
    teamlead: {app: kp-reviewer, permissions: {contents: read, pull_requests: read}}
    deputy: {app: kp-reviewer, permissions: {contents: read, pull_requests: read}}
    retro: {app: kp-reviewer, permissions: {contents: read, pull_requests: read}}
