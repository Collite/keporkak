# Slot limits per dimension (BU-4) and warning thresholds (contracts.md §9; values: plan.md §4.1, D-47).
version: 1
# total: with one office running it cannot exceed its 4 (Panda's until 2026-11-24, then dsk's).
slots: {total: 4, per_subscription: {claude: 4}, per_office: {panda: 4, dsk: 4}, stages_in_flight_per_effort: 2}
# fractions of a subscription's limit; robots/pool.yaml POOL-7 reads them as warn.0 and warn.1
warn: [0.7, 0.9]
# provisioning pauses; a running seat is never stopped
on_cap: pause_provisioning
# how a turn's tokens are counted — each part against an input token (D-92, D-116) — and DEP-6's baseline (contracts.md §9)
usage:
  weights: {input: 1, output: 5, cache_write: 1.25, cache_read: 0.1}
  median: {days: 14, least: 3}
