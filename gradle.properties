org.gradle.jvmargs=-Xmx1536m
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m
# Gradle's local build cache (S2.8 T2), under the Gradle user home: the worktrees of one machine share it. It is on only
# because every test task declares what it reads — the root convention and each module's own inputs — so that no cached
# result can be stale. CI starts with an empty one.
org.gradle.caching=true
