# The Claude packaging data (contracts.md §10): data, not code. It maps each neutral `deny:` word of a persona to the
# rules a Claude seat's config home carries in permissions.json, names the MCP servers a persona may list, by address, and says which
# Claude Code event runs each of the three hooks (§11). kp-driver compiles it at every start of a seat (S2.2);
# scripts/render-agents.py reports a word or a server a persona uses that it does not map, and a placeholder nothing
# fills. Never edited to fit one seat: a seat's home is built from this file, never edited by hand.
#
# Placeholders, written {name}:
#   the session's, which the caller gives —
#     worktree      the session's working directory: the stage's worktree, or the project checkout for a seat with no stage
#     scratch       the session's scratch folder
#     project       the project checkout
#     own_file      the one project file a `…-beyond-own-list` or `…-beyond-own-report` seat may write
#     code_repos    the office's code checkouts and its worktrees' root (pool/offices.yaml)
#     mcp_listen    the address the daemon's MCP server listens on (pool/offices.yaml `listen.mcp`)
#   the profile's, from the frontmatter of docs/profiles/<name>.md — default_branch, pin_files, cluster_tools,
#     demo_context. A list fills one pattern per value; an empty list or null leaves the rule out.
#
# A rule denies a call when its tool's name is one of `tools` (a name ending `__*` is every tool of that MCP server)
# and, if given:
#   command  — a regular expression for a command, its name and what follows, matched where a command starts in one
#              line of the call's `command`: `command_start` (below) stands before it. Placeholders are filled as
#              literal text. Each line is judged on its own, and one matching line denies the call; a line that ends
#              in a backslash, not itself escaped, goes on in the next, as in the shell — so a pattern never runs across
#              a newline. A word inside an argument does not trip it; a command hidden in a script, `sh -c`, `env` or
#              `xargs` is not seen, and a line of a heredoc or a quoted string is judged as if it were a command;
#   line     — a regular expression found anywhere in one line of the call's `command`, judged the same way;
#   path     — globs one of the call's paths matches (the fields `requests.paths` names, absolute or relative to the
#              working directory; `**` is any part of a path, `*` any part of one name), and `except` globs it does not;
#   outside  — `writable`: a path outside what the session may write (below) — `path` is then every path.
# The rules have one source, this file, compiled into a home's permissions.json, and two matchers: the deny hook and
# the driver's answerer (contracts.md §10, §11). settings.json holds the three hooks and no permission rule.
version: 1

# What a session may write (contracts.md §10): its working directory, its scratch and its own file — the one a
# `…-beyond-own-…` word leaves writable. A seat with no such word has no own file, and that glob is left out. The
# default of engagement.yaml:permissions answers a write by this set, and `outside-worktree` denies a write outside it.
writable: ["{worktree}/**", "{scratch}/**", "{own_file}"]

# Where a command starts in one line, and what may stand before its name (issue #22): the line's start, `;`, `&`,
# `|`, `(`, `{` or a backtick; then any of a shell keyword (`if`, `then`, `else`, `elif`, `do`, `while`, `until`, `!`),
# an environment assignment, a wrapper (`nohup`, `time`, `nice`, `exec`, `command`, `setsid`, `stdbuf`, `timeout`)
# with its options and numbers; then a path to the program. It stands before every rule's `command`.
command_start: '(^|[;&|(`{])\s*((if|then|else|elif|do|while|until|!)\s+|[A-Za-z_][A-Za-z0-9_]*=("[^"]*"|''[^'']*''|[^\s;&|`''"]*)\s+|(nohup|time|nice|exec|command|setsid|stdbuf|timeout)(\s+(-\S*|[0-9]\S*))*\s+)*(\S*/)?'

# What a request is, for the default of engagement.yaml:permissions (contracts.md §4.3, §10). A request's paths are
# these fields of its input, for the rules' `path` too. A request whose tool is one of `read` is a read; any other
# request that names a path is a write, answered by its paths and the writable set; a request that names no path —
# a command, an MCP tool, a fetch — is judged by the deny rules alone.
requests:
  paths: [file_path, path, notebook_path]
  read: [Read, Glob, Grep, LS, NotebookRead]

deny:
  side-channels:
    denies: vendor cross-session messaging and sub-session tools; tmux, ssh, claude, kp, sudo
    rules:
      - tools: [Agent, Task, SendMessage, ListAgents, Workflow, TeamCreate, TeamDelete, RemoteTrigger, SendToProject, SendToProjectContext, EnterWorktree, ExitWorktree]
      - tools: [Bash]
        command: '(tmux|ssh|claude|kp|sudo)(\s|$|[;&|`)])'
  push-master:
    denies: a push to the default branch (the ruleset is the fence; this is the early no)
    rules:
      - tools: [Bash]
        command: 'git\s([^;&|]*\s)?push\b[^;&|]*[\s:/+]{default_branch}(\s|$|[;&|`)])'
  pin-files:
    denies: writes to the profile's pin files
    rules:
      - tools: [Write, Edit, MultiEdit, NotebookEdit]
        path: ["{worktree}/{pin_files}"]
  outside-worktree:
    denies: writes outside what the session may write — its working directory, its scratch, its own file
    rules:
      - tools: [Write, Edit, MultiEdit, NotebookEdit]
        outside: writable
  live-target:
    denies: the profile's cluster tools and kp-qa, kp-cred
    rules:
      - tools: [Bash]
        command: '({cluster_tools})(\s|$|[;&|`)])'
      - tools: [Bash]
        command: '(kp-qa|kp-cred)(\s|$|[;&|`)])'
  browser:
    denies: Playwright outside a test suite, opening URLs, computer use
    rules:
      - tools: ["mcp__playwright__*", "mcp__computer-use__*", "mcp__claude-in-chrome__*"]
      - tools: [Bash]
        # Playwright run as a test suite (`playwright test`, `npx playwright test`) is allowed (contracts.md §10).
        command: '(npx\s+playwright|playwright)(?!\s+test(\s|$|[;&|`)]))(\s|$|[;&|`)])|(xdg-open|sensible-browser|x-www-browser|firefox|chromium|chromium-browser|google-chrome)(\s|$|[;&|`)])'
  write-code:
    denies: writes in any code repo
    rules:
      - tools: [Write, Edit, MultiEdit, NotebookEdit]
        path: ["{code_repos}/**"]
  write-project:
    denies: writes in the project repo
    rules:
      - tools: [Write, Edit, MultiEdit, NotebookEdit]
        path: ["{project}/**"]
  write-project-beyond-own-list:
    denies: writes in the project repo, but to the seat's own stage list
    rules:
      - tools: [Write, Edit, MultiEdit, NotebookEdit]
        path: ["{project}/**"]
        except: ["{own_file}"]
  write-project-beyond-own-report:
    denies: writes in the project repo, but to the seat's own report
    rules:
      - tools: [Write, Edit, MultiEdit, NotebookEdit]
        path: ["{project}/**"]
        except: ["{own_file}"]
  demo-cluster:
    denies: any command naming the demo cluster's context
    rules:
      - tools: [Bash]
        line: '(--context|--kube-context|use-context)[=\s]+["'']?{demo_context}["'']?(\s|$|[;&|`)])'

# The MCP servers a persona may name under tools.mcp, by address. The messaging server gets the session's token as
# its bearer (contracts.md §5).
mcp:
  messaging: {url: "http://{mcp_listen}/mcp", session_token: true}
  context7: {url: "https://mcp.context7.com/mcp"}

# The three hooks (contracts.md §11): the Claude Code event each runs on, and its limit in seconds. stop-gate gives
# up on the daemon after `limit`; Claude Code ends a hook after `timeout`.
hooks:
  inbox-first: {event: SessionStart, timeout: 10}
  deny: {event: PreToolUse, matcher: "*", timeout: 10}
  stop-gate: {event: Stop, timeout: 30, limit: 10}
