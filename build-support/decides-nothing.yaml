# The check that the daemon decides nothing (S3.0 T3; architecture.md §2) — kp-rules' DecidesNothingSpec, which `just
# check` runs: on the syntax tree of the main sources of kp-driver, kp-daemon, kp-seat-api, kp-engine and kp-ops (S3.8,
# D-98), every comparison or ordering — an equality with a value of the rules' caps or engagement among them — timer,
# kind's name, number but zero, word for a conclusion and answerer's name is a finding
# (kp-rules/src/test/kotlin/kp/rules/decidesnothing/DecidesNothing.kt says which shape holds which module). A finding not listed here
# fails the check with its file and line; so does an entry with no reason, one for a number that is the stop gate's
# cap in the seat API or the engine, and one the sources no longer need. An entry names the file, the shape, the
# declaration the finding is in, its code as written and the line it stands on: every line of the statement it is in,
# whole, but for the inner lines of a lambda or an object beside it, shown as `…` (whitespace collapsed in both). An
# edit anywhere on that line leaves a finding no entry excuses (review-026 B1). A code found twice there needs two
# entries. Each reason says why the line decides nothing: what it compares, waits for or names, and whose it is.
#
# The words for a conclusion about a seat: no name, literal or comment of the driver or the seat API holds one.
conclusions: [stall, stalled, stalling, done, idle, hung, stuck]
