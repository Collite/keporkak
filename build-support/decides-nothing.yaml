# The check that the daemon decides nothing (S3.0 T3; architecture.md §2) — kp-rules' DecidesNothingSpec, which `just
# check` runs: on the syntax tree of the main sources of kp-driver, kp-daemon, kp-seat-api and kp-engine, every
# comparison or ordering, timer, kind's name, number but zero, word for a conclusion and answerer's name is a finding
# (kp-rules/src/test/kotlin/kp/rules/DecidesNothing.kt says which shape holds which module). A finding not listed here
# fails the check with its file and line; so does an entry with no reason, one for a number that is the stop gate's
# cap in the seat API or the engine, and one the sources no longer need. An entry names the file, the shape, the
# declaration the finding is in and its code as written (whitespace collapsed); a code found twice there needs two
# entries. Each reason says why the line decides nothing: what it compares, waits for or names, and whose it is.
#
# The words for a conclusion about a seat: no name, literal or comment of the driver or the seat API holds one.
conclusions: [stall, stalled, stalling, done, idle, hung, stuck]
exceptions:
  kp-daemon/src/main/kotlin/kp/daemon/Check.kt:
  - shape: comparison
    in: Check.run
    code: sorted()
    reason: '`kp check`: a folder''s log files in the order of their names'
  - shape: comparison
    in: Check.run
    code: sortedBy { it.entry.seq }
    reason: '`kp check`: a daemon log''s lines in `seq` order'
  - shape: comparison
    in: Check.run
    code: sortedBy { it.entry.seq }
    reason: '`kp check`: a hand log''s lines in `seq` order'
  - shape: comparison
    in: Check.daemonLog
    code: it > 0
    reason: '`kp check`: how many lines of a log it skipped — a count it reports'
  - shape: comparison
    in: Check.daemonLog
    code: skipped == 1
    reason: '`kp check`''s wording: one voided line or more'
  - shape: comparison
    in: Check.daemonLog
    code: judged == 1
    reason: '`kp check`''s wording: one message re-judged or more'
  - shape: comparison
    in: Check.daemonLog
    code: differ == 1
    reason: '`kp check`''s wording: one outcome that differs or more'
