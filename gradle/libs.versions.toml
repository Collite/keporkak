[versions]
# Checked 2026-11-13: https://github.com/modelcontextprotocol/kotlin-sdk/blob/0.16.0/gradle/libs.versions.toml
kotlin = "2.4.21"
# Checked 2026-11-13: https://services.gradle.org/versions/current (distribution checksum in wrapper properties).
gradle = "9.9.1"
# Checked 2026-11-13: pinned by contracts/architecture; Maven Central acp-jvm/0.34.0 POM and upstream v0.34.0 catalog.
acp = "0.34.0"
# Checked 2026-11-13: pinned by contracts/architecture; Maven Central kotlin-sdk-jvm/0.16.0 POM.
mcp = "0.16.0"
# Checked 2026-11-13: MCP 0.16.0 release catalog and Maven Central kotlinx-serialization-json-jvm/1.11.0 POM.
serialization = "1.11.0"
# Checked 2026-11-13: MCP 0.16.0 release catalog and Maven Central kotest-runner-junit5-jvm/6.2.6 POM.
kotest = "6.2.6"
# Checked 2026-11-13: Kotest 6.2.6 published POM (junit-platform-launcher 1.13.4).
junit-platform = "1.13.4"
# Checked 2026-11-14: Maven Central kaml-jvm maven-metadata.xml (0.104.0 is the latest) and its POM (kotlinx-serialization-core
# 1.9.0, kotlin-stdlib 2.2.21; resolved up to this catalog's pins); API from context7 /charleskorn/kaml. The YAML reader of S1.0.
kaml = "0.104.0"
# Checked 2026-11-15: Maven Central slf4j-api maven-metadata.xml (2.0.18 is the newest that is not an alpha) and the version
# the MCP SDK 0.16.0 resolves on kp-model's test classpath. The ACP SDK's kotlin-logging needs an SLF4J API at run time (S2.1).
slf4j = "2.0.18"
# Checked 2026-11-17: the MCP SDK 0.16.0's server and client POMs name Ktor 3.5.2, and Maven Central has ktor-server-cio-jvm and
# ktor-client-cio-jvm at 3.5.2 (their POMs: ktor 3.5.2, kotlinx-coroutines 1.11.0, slf4j-api 2.0.18). The seat API's HTTP engine (S2.3).
ktor = "3.5.2"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
acp = { module = "com.agentclientprotocol:acp", version.ref = "acp" }
mcp = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp" }
mcp-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp" }
mcp-client = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcp" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
kotest = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
