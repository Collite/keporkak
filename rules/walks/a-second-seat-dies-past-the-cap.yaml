# D-118, T-82: a second seat dies in a stage already paused past the cap. The coder's fourth death pauses the stage and
# asks Bora (T-81, POOL-11); the reviewer's death while it is paused asks him again: its seat-gone fires T-82 and SEAT-06,
# a step of its own, as D-81's walk pins T-80 — one ruling-request per death. The coder's death is reported twice — the
# process gone and the protocol closed — in an order the world does not fix (contracts.md §4.4, Amendment 30): whichever
# report comes first sends seat-gone and the ruling-request, and the second finds the seat gone and sends nothing. Bora's
# two rulings re-seat both seats (SEAT-43), each on a thread of its own (FLAG_THREAD-01; D-124); the first re-seat returns
# the stage (T-60), the second moves its seat only (SEAT-07). Walked in S3.4, which the folder of D-118 left open; the
# reviewer's death ordered in its fix round (review-038 B1).
# Supplied observations and fake operation results; this walk never runs external actions.
name: a-second-seat-dies-past-the-cap
stage: S9.10
initial: building
final: building
seats:
  coder-1: coder
  reviewer-1: reviewer
facts:
  seat.process_gone: false
  seat.protocol_closed: false
  seat.tool_call_open_for: 0
  seat.inbox_replayed: true
  bora.present: true
  budget.slots_over: 1
