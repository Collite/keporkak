# D-118, T-85: Bora recuts a stage whose seats died past the cap while it is not paused. The coder's fourth death pauses
# the stage and asks him (T-81); his ruling re-seats it (SEAT-43) and the stage goes on (T-60). He then recuts it from
# building, in reply to the death's seat-gone — a message of the stage that raised no ticket, which `kp rule` names by its
# id (contracts.md §6, Amendment 24) — and the seat, ready and its stage recut, is retired (SEAT-44). Walked in S3.4,
# which the folder of D-118 left open.
# Supplied observations and fake operation results; this walk never runs external actions.
