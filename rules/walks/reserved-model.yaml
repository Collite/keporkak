name: reserved-model
stage: S2.4
initial: building
final: building
stages:
  S2.4:
    machines:
      seat: provisioned
facts:
  budget.slot_open: true
  seat.model:
    coder-3: claude-fable-5-2
  roster.model_allowed:
    coder-3: false
steps:
