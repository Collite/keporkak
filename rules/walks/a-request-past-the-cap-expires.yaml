# D-118: a request of the Pool Manager's past the cap that waits for Bora. The coder's fourth death pauses the stage and
# asks him (T-81, POOL-11); the walk ends with the request open. A spec then lets its deadline pass on the daemon's clock:
# the expiry is reported to Bora, its T-32 leaves `ruling_pending` only, and in `paused` nothing moves — the stage stays
# paused and the seat gone (S3.4; the walker plays no expiry). Walked in S3.4, which the folder of D-118 left open.
# Supplied observations and fake operation results; this walk never runs external actions.
