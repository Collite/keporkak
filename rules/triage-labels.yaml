# Canonical triage roles → the real label strings per repository (the Gardener's skill `triage-issues`).
# A repository not listed uses the defaults. Change a string here, never in the skill.
version: 1
categories: [bug, enhancement]
states: [needs-triage, needs-info, ready-for-agent, ready-for-human, wontfix]
defaults:
  bug: bug
  enhancement: enhancement
  needs-triage: needs-triage
  needs-info: needs-info
  ready-for-agent: ready-for-agent
  ready-for-human: ready-for-human
  wontfix: wontfix
repositories: {}        # e.g. "Collite/ttr-core": {wontfix: "not planned"}
disclaimer: "> *This was generated by AI during triage.*"
