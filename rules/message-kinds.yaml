# Message catalogue — typed arguments, class cases, deadlines and executable requirements (contracts §4.2).
version: 1
kinds:
  assignment-proposal:
    from: teamlead
    to: bora
    fires: planned→proposed
    guard: 'R4.8 predecessors exited · seat free · slots open · fence has SC ids + touches: (all observed)'
    class:
      default: B
      cases: []
    max_fires: 2
    deadline: 24h
    on_expiry: back to planned; principal pinged
    reply: approval | decline
    note: never graduates to C (D-27 d)
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      role:
        type: string
        required: true
      level:
        type: string
        required: true
      seat:
        type: string
        required: true
      branch:
        type: string
    window: stage
    require:
    - fact: plan.predecessors_exited
    - fact: pool.seat_available
      role:
        arg: role
      level:
        arg: level
    - fact: budget.slot_open
      dimension: office
    - fact: budget.slot_open
      dimension: subscription
    - fact: budget.slot_open
      dimension: effort
    - fact: list.fence_complete
    - fact: list.tasks_total
      gte:
        cap: stage_tasks_min
    - fact: list.tasks_total
      lte:
        cap: stage_tasks_max
    - fact: list.lines
      lte:
        cap: stage_list_lines
    expiry:
    - transition: T-07
  queue-approval:
    from: bora
    to: teamlead
    fires: '-'
    guard: stages are in the current wave (R4.8) · signed by Bora's CLI
    class:
      default: B
      cases: []
    max_fires: 1
    deadline: null
    on_expiry: '-'
    reply: '-'
    note: 'U-2: tonight''s pre-approved queue; the only ''yes'' while absent (D-28)'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      stages:
        type: array
        required: true
        items:
          type: string
    window: day
    require:
    - signed: bora
    - fact: plan.in_current_wave
      stage:
        arg: stages
    expiry: []
  approval:
    from: bora
    to: teamlead
    fires: proposed→assigned | phase exit_pending→exited
    guard: signed by Bora's CLI
    class:
      default: B
      cases: []
    max_fires: 1
    deadline: null
    on_expiry: '-'
    reply: '-'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      outcome:
        type: string
    window: stage
    require:
    - signed: bora
    expiry: []
  queued-approval:
    from: deputy
    to: teamlead
    cc:
    - bora
    fires: proposed→assigned
    guard: Bora absent · the stage is named in a queue-approval signed by Bora for the current wave · the stage
      was not cut after he left (DEP-2)
    class:
      default: A
      cases: []
    max_fires: 1
    deadline: null
    on_expiry: '-'
    reply: '-'
    note: the only yes the Deputy has; listed in the digest
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
    window: stage
    require:
    - fact: bora.present
      eq: false
    - fact: queue.names
    - fact: stage.cut_at
      lte:
        fact: bora.absent_since
    - fact: log.count
      kind: reverse
      scope: office
      where:
        severity: serious
      since: queue-approval
      eq: 0
    expiry: []
  decline:
    from: bora
    to: teamlead
    fires: proposed→planned
    guard: signed by Bora's CLI
    class:
      default: B
      cases: []
    max_fires: 1
    deadline: null
    on_expiry: '-'
    reply: '-'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
    window: stage
    require:
    - signed: bora
    expiry: []
  assign:
    from: teamlead
    to: coder
    fires: seat ready→busy
    guard: stage assigned (approval or queue)
    class:
      default: A
      cases: []
    max_fires: 1
    deadline: 15m
    on_expiry: seat-gone check by the Pool Manager
    reply: started
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      seat:
        type: string
        required: true
    window: stage
    require:
    - fact: stage.state
      eq: assigned
    expiry: []
  started:
    from: coder
    to: teamlead
    fires: assigned→building
    guard: branch off master exists (observed)
    class:
      default: A
      cases: []
    max_fires: 1
    deadline: null
    on_expiry: '-'
    reply: '-'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
    window: stage
    require:
    - fact: git.branch_exists
    expiry: []
  stop:
    from: coder
    to: principal
    cc:
    - teamlead
    fires: building|fix_round*→stopped
    guard: names a stop-condition id (SC-n) from the fence
    class:
      default: C
      cases: []
    max_fires: 2
    deadline: 4h
    on_expiry: escalate to Bora (B)
    reply: triage
    note: replaces `question` (D-27 i); the 3rd stop per stage needs Bora
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      sc:
        type: string
        required: true
    window: stage
    require:
    - arg: sc
      in:
        fact: list.stop_conditions
    expiry:
    - report: bora
      class: B
      if:
        fact: bora.present
  found-batch:
    from: mailroom
    to: principal
    fires: 'found items: created'
    guard: fan-out of the Found lines carried by review-request
    class:
      default: A
      cases: []
    max_fires: 3
    deadline: null
    on_expiry: '-'
    reply: triage
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      found:
        type: array
    window: stage
    require:
    - fact: list.found_untriaged
      gt: 0
    expiry: []
  triage:
    from: principal
    to: coder
    cc:
    - teamlead
    fires: stopped→building | stopped→recut | found→triaged
    guard: outcome ∈ {resume, recut, issue, stage, drop} · task-count diff within R4.11 · no edit outside the Found
      section (observed) · resumes ≤ 2 then Bora
    class:
      default: A
      cases:
      - if:
          arg: outcome
          eq: stage
        class: C
      - if:
          arg: outcome
          eq: recut
        class: B
    max_fires: 6
    deadline: null
    on_expiry: '-'
    reply: '-'
    note: 'the brief''s scope: add · delete · split · merge tasks, never re-design'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      outcome:
        enum:
        - resume
        - recut
        - issue
        - stage
        - drop
        required: true
      found:
        type: string
      since:
        type: string
    window: stage
    require:
    - arg: outcome
      in:
      - resume
      - recut
      - issue
      - stage
      - drop
    - fact: list.sections_changed
      since:
        arg: since
      in:
      - Found while doing
    expiry: []
  qa-request:
    from: coder | teamlead
    to: qa
    fires: '-'
    guard: 'cites the stage, a task id and a DONE item that exist in the list (observed) · stage live: ≠ none ·
      names what to verify, never a command (P-5)'
    class:
      default: A
      cases: []
    max_fires: 3
    deadline: 2h
    on_expiry: stop SC-9 for the asker
    reply: qa-report
    note: one QA job at a time per office; tail jobs first, then FIFO (D-31)
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      task:
        type: string
        required: true
      done:
        type: string
        required: true
      verify:
        type: string
        required: true
    window: stage
    require:
    - fact: list.task_exists
      id:
        arg: task
    - fact: list.done_item_exists
      id:
        arg: done
    - fact: stage.live
      ne: none
    - arg: verify
    expiry:
    - emit: nudge
      to:
        re: from
      args:
        rule: SC-9
        failed_guard: QA deadline expired
        sc: SC-9
  qa-report:
    from: qa
    to:
      re: from
    cc:
    - teamlead
    fires: building→candidate_deployed
    guard: 'outcome ∈ {pass, fail} · pointers: fixture path, command, counts · temp pods and namespace dropped (observed)
      · the transition fires on pass only'
    class:
      default: A
      cases: []
    max_fires: 3
    deadline: null
    on_expiry: '-'
    reply: '-'
    note: 'U-1: the candidate is verified live before review; candidates run outside GitOps in a qa-<stage> namespace'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      outcome:
        enum:
        - pass
        - fail
        required: true
      fixture:
        type: string
        required: true
      command:
        type: string
        required: true
      counts:
        type: object
        required: true
      sha:
        type: string
        required: true
    window: stage
    require:
    - fact: fixture.exists
      pointer:
        arg: fixture
    - fact: live.namespace_absent
      stage:
        msg: stage
    expiry: []
  computer-use-session:
    from: qa
    to: bora
    fires: '-'
    guard: computer use only (looking at the screen and clicking) — a scripted browser in QA's own profile needs
      no session · cites the task and DONE item
    class:
      default: A
      cases:
      - if:
          fact: office.computer_use
          eq: B
        class: B
      - if:
          fact: office.computer_use
          eq: C
        class: C
    max_fires: 3
    deadline: 2h
    on_expiry: held while absent; expired → stop SC-9 for the asker
    reply: approval (where B)
    note: 'D-36 c: only computer use is governed, even on the Mac'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      task:
        type: string
        required: true
      done:
        type: string
        required: true
      purpose:
        type: string
        required: true
    window: stage
    require:
    - fact: list.task_exists
      id:
        arg: task
    - fact: list.done_item_exists
      id:
        arg: done
    - fact: office.computer_use
      ne: 'off'
    expiry:
    - report: bora
      class: C
      if:
        fact: bora.present
    - emit: nudge
      to:
        re: from
      args:
        rule: SC-9
        failed_guard: computer-use deadline expired
        sc: SC-9
  review-request:
    from: coder
    to: teamlead
    cc:
    - principal
    fires: building|candidate_deployed→ready_for_review
    guard: PR ready · CI green on head · every task done <sha> · DONE lines ticked · Found lines carried (fan-out
      found-batch)
    class:
      default: A
      cases: []
    max_fires: 3
    deadline: 1h
    on_expiry: nudge teamlead; 2nd expiry → Bora (C)
    reply: review-bind
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      found:
        type: array
    window: stage
    require:
    - fact: pr.ready
    - fact: ci.state
      of:
        fact: pr.head
      eq: green
    - fact: list.tasks_open
      eq: 0
    - attest: done_lines_hold
    expiry:
    - transition: T-74
    - emit: nudge
      to: teamlead
      args:
        rule: T-74
        failed_guard: nudge teamlead; 2nd expiry → Bora (C)
      if:
        counter: review_request_expiries
        lt:
          cap: expiries_before_escalation
    - report: bora
      class: C
      if:
        counter: review_request_expiries
        gte:
          cap: expiries_before_escalation
  review-bind:
    from: teamlead
    to: reviewer
    cc:
    - coder
    fires: ready_for_review→in_review
    guard: reviewer seat ≠ coder seat · rank(reviewer) ≥ rank(coder) (roster) · reviewer model ≥ review floor (D-45)
    class:
      default: A
      cases: []
    max_fires: 2
    deadline: 8h
    on_expiry: re-bind once, then Bora (C)
    reply: verdict
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      reviewer:
        type: string
        required: true
    window: stage
    require:
    - fact: seat.name
      of:
        arg: reviewer
      ne:
        fact: seat.name
        of: coder
    - fact: roster.rank
      of:
        arg: reviewer
      gte:
        fact: roster.rank
        of: coder
    - fact: roster.model_rank
      of:
        arg: reviewer
      gte:
        fact: roster.floor_rank
    expiry:
    - transition: T-75
    - emit: nudge
      to: teamlead
      args:
        rule: T-75
        failed_guard: re-bind once, then Bora (C)
      if:
        counter: review_bind_expiries
        lt:
          cap: expiries_before_escalation
    - report: bora
      class: C
      if:
        counter: review_bind_expiries
        gte:
          cap: expiries_before_escalation
  verdict:
    from: reviewer
    to: coder
    cc:
    - teamlead
    fires: in_review→passed | fix_round
    guard: R5.2 shape · GitHub PR review on the same head sha (observed, R6.2) · FIX FIRST lists blockers with ids
    class:
      default: A
      cases: []
    max_fires: 1
    deadline: null
    on_expiry: '-'
    reply: repair-done (if FIX FIRST)
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      verdict:
        enum:
        - PASS
        - PASS-FU
        - FIX FIRST
        required: true
      sha:
        type: string
        required: true
      blockers:
        type: array
        items:
          type: object
          required_fields:
          - id
      follow_ups:
        type: array
    window: stage
    require:
    - fact: pr.review_on
      sha:
        fact: pr.head
      ne: none
    - arg: sha
      eq:
        fact: pr.head
    expiry: []
  repair-done:
    from: coder
    to: reviewer
    fires: fix_round|fix_round_3|fix_round_4→re_review
    guard: new commits since the verdict · CI green · one response line per blocker id (all observed)
    class:
      default: A
      cases: []
    max_fires: 4
    deadline: 8h
    on_expiry: nudge reviewer; 2nd → teamlead
    reply: re-verdict
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      verdict:
        type: string
        required: true
    window: stage
    require: []
    expiry:
    - transition: T-76
    - emit: nudge
      to: reviewer
      args:
        rule: T-76
        failed_guard: nudge reviewer; 2nd → teamlead
      if:
        counter: repair_expiries
        lt:
          cap: expiries_before_escalation
    - emit: nudge
      to: teamlead
      args:
        rule: T-76
        failed_guard: nudge reviewer; 2nd → teamlead
      if:
        counter: repair_expiries
        gte:
          cap: expiries_before_escalation
  re-verdict:
    from: reviewer
    to: coder
    cc:
    - teamlead
    - principal
    fires: re_review→passed | fix_round | grant_pending | ruling_pending | recut
    guard: per open blocker only · a new finding only with introduced_by_fix (attested, logged)
    class:
      default: A
      cases:
      - if:
          not:
            any:
            - not:
                arg: verdict
                eq: FIX FIRST
            - not:
                counter: fix_rounds
                gte:
                  cap: fix_rounds_autonomous
        class: C
    max_fires: 4
    deadline: null
    on_expiry: '-'
    reply: '-'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      verdict:
        enum:
        - PASS
        - PASS-FU
        - FIX FIRST
        required: true
      sha:
        type: string
        required: true
      blockers:
        type: array
        items:
          type: object
          required_fields:
          - id
        required: true
      new_findings:
        type: array
      follow_ups:
        type: array
      reviewed:
        type: array
        items:
          type: string
        required: true
    window: stage
    require:
    - fact: pr.review_on
      sha:
        fact: pr.head
      ne: none
    - arg: sha
      eq:
        fact: pr.head
    - any:
      - not:
          arg: new_findings
      - attest: introduced_by_fix
    - arg: reviewed
      eq:
        fact: review.open_blockers
    expiry: []
  grant-request:
    from: mailroom
    to: principal
    cc:
    - reviewer
    - coder
    fires: '-'
    guard: emitted on the 3rd FIX FIRST (fix_rounds = 2)
    class:
      default: C
      cases: []
    max_fires: 1
    deadline: 4h
    on_expiry: recut
    reply: grant
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
    window: stage
    require:
    - counter: fix_rounds
      eq:
        cap: fix_rounds_autonomous
    expiry:
    - transition: T-27
  grant:
    from: principal
    to: reviewer
    cc:
    - coder
    - teamlead
    fires: grant_pending→fix_round_3 | recut
    guard: outcome ∈ {grant, refuse} · within deadline
    class:
      default: C
      cases: []
    max_fires: 1
    deadline: null
    on_expiry: '-'
    reply: '-'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      outcome:
        enum:
        - grant
        - refuse
        required: true
    window: stage
    require: []
    expiry: []
  contract-flag:
    from: reviewer
    to: principal
    fires: 'flag thread: asked'
    guard: cites contracts.md § or a D-n
    class:
      default: C
      cases: []
    max_fires: 2
    deadline: null
    on_expiry: '-'
    reply: '-'
    note: RV-10; a contract change is never executed in the stage (R5.4)
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      citation:
        type: string
        required: true
      default:
        type: string
    window: stage
    require:
    - arg: citation
    expiry: []
  classify-request:
    from: reviewer
    to: bora
    fires: 'flag thread: asked'
    guard: blocker-vs-follow-up question only (R5.4)
    class:
      default: B
      cases: []
    max_fires: 3
    deadline: 24h
    on_expiry: held while absent; expired → reported
    reply: ruling
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      question:
        type: string
        required: true
      default:
        type: string
        required: true
    window: stage
    require:
    - arg: question
    expiry:
    - report: bora
      class: C
      if:
        fact: bora.present
  merge:
    from: teamlead
    to: daemon
    cc:
    - bora
    fires: passed→merged | frozen | tail_failed
    guard: 'Bora present (deadman) · second key (different reviewer seat, rank ≥ coder, model ≥ review floor; D-45)
      else B · audit: evidence lines · list ticked · no proof files · Found all triaged · no stray changes (observed)'
    class:
      default: C
      cases:
      - if:
          any:
          - not:
              fact: seat.name
              of: reviewer
              ne:
                fact: seat.name
                of: coder
          - not:
              fact: roster.rank
              of: reviewer
              gte:
                fact: roster.rank
                of: coder
          - not:
              fact: roster.model_rank
              of: reviewer
              gte:
                fact: roster.floor_rank
        class: B
    max_fires: 2
    deadline: 15m
    on_expiry: tail_failed
    reply: '-'
    note: D-27 a, n; master protected by GitHub branch protection
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
    window: stage
    require:
    - fact: bora.present
    - fact: pr.evidence_present
    - fact: list.tasks_open
      eq: 0
    - fact: project.proof_files
      eq: 0
    - fact: list.found_untriaged
      eq: 0
    expiry:
    - transition: T-77
  release:
    from: teamlead
    to: daemon
    cc:
    - bora
    fires: merged→released | tail_failed
    guard: 'stage rolls: ≠ none · build green · tag'
    class:
      default: C
      cases: []
    max_fires: 2
    deadline: 1h
    on_expiry: tail_failed
    reply: '-'
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
    window: stage
    require:
    - fact: stage.rolls
      ne: none
    - fact: bora.present
    expiry:
    - transition: T-78
  deploy-request:
    from: teamlead
    to: qa
    cc:
    - bora
    fires: '-'
    guard: 'stage released · live: target named · Bora present (deadman)'
    class:
      default: C
      cases: []
    max_fires: 2
    deadline: 2h
    on_expiry: tail_failed
    reply: deploy-done | deploy-failed
    note: the TeamLead requests; QA executes and verifies (D-30)
    args:
      attest:
        type: array
        items:
          enum:
          - done_lines_hold
          - introduced_by_fix
          - floors_checked
      pin:
        type: string
        required: true
      smoke:
        type: string
        required: true
    window: stage
    require:
    - fact: stage.state
      eq: released
    - fact: stage.live
      ne: none
    - fact: bora.present
    expiry:
    - transition: T-79
  roll:
    from: qa
    to: daemon
    cc:
    - bora
    fires: '-'
    guard: an open deploy-request · the GitOps change for this stage's pin only · or the revert of QA's own failed
      roll
    class:
      default: C
      cases: []
    max_fires: 2
    deadline: 30m
    on_expiry: deploy-failed
    reply: '-'
    note: the durable roll is a GitOps change through the daemon (D-27 n)
    args:
