name: 'what S1.7 wrote into the rules — replies, {wait: again}, the profile (contracts.md §4.2, §4.3, Amendment 12)'
scenarios:
  - name: a replies that names an unknown kind is reported
    given:
      kinds:
        started:
          from: coder
          to: teamlead
          guard: '-'
          reply: started-ack
          replies: [started-ack]
          args: {}
          class: {default: A}
          window: stage
          max_fires: null
          deadline: null
          expiry: []
          require: []
      transitions:
        - {id: T-start, from: planned, to: exited, kind: started, 'on': message, guard: '-', require: [], effects: []}
    expect:
      failures: ["started: unknown kind 'started-ack'"]
  - name: 'a {wait: again} with no if that reads a counter against a cap is reported'
    given:
      counters: {started_expiries: {scope: stage}}
      caps: {expiries_before_escalation: 2}
      states: {planned: {bora_gate: true}, exited: {terminal: true}}
      kinds:
        started:
          from: coder
          to: teamlead
          guard: '-'
          on_expiry: nudge; 2nd expiry → Bora
          args: {}
          class: {default: A}
          window: stage
          max_fires: null
          deadline: 1h
          expiry:
            - {transition: T-expire}
            - {wait: again}
            - {wait: again, if: {counter: started_expiries, lt: {cap: expiries_before_escalation}}}
          require: []
      transitions:
        - {id: T-start, from: planned, to: exited, kind: started, 'on': message, guard: '-', require: [], effects: []}
        - {id: T-expire, from: planned, to: planned, kind: started, 'on': expiry, guard: '-', require: [], effects: [{count: started_expiries}]}
    expect:
      failures: ["started: {wait: again} has no if that reads a counter against a cap"]
  - name: 'a {wait: again} whose if is not lt its cap never ends, and is reported (issue #18)'
    given:
      counters: {started_expiries: {scope: stage}}
      caps: {expiries_before_escalation: 2}
      states: {planned: {bora_gate: true}, exited: {terminal: true}}
      kinds:
        started:
          from: coder
          to: teamlead
          guard: '-'
          on_expiry: nudge; 2nd expiry → Bora
          args: {}
          class: {default: A}
          window: stage
          max_fires: null
          deadline: 1h
          expiry:
            - {transition: T-expire}
            - {wait: again, if: {counter: started_expiries, gte: {cap: expiries_before_escalation}}}
            - {wait: again, if: {counter: started_expiries, lt: {cap: expiries_before_escalation}}}
          require: []
      transitions:
        - {id: T-start, from: planned, to: exited, kind: started, 'on': message, guard: '-', require: [], effects: []}
        - {id: T-expire, from: planned, to: planned, kind: started, 'on': expiry, guard: '-', require: [], effects: [{count: started_expiries}]}
    expect:
      failures: ["started: {wait: again}'s if is not lt a cap on a counter an on: expiry transition of the kind moves"]
  - name: 'a {wait: again} on a counter no on: expiry transition of the kind moves never ends, and is reported (issue #18)'
    given:
      counters: {started_expiries: {scope: stage}, other_expiries: {scope: stage}}
      caps: {expiries_before_escalation: 2}
      states: {planned: {bora_gate: true}, exited: {terminal: true}}
      kinds:
        started:
          from: coder
          to: teamlead
          guard: '-'
          on_expiry: nudge; 2nd expiry → Bora
          args: {}
          class: {default: A}
          window: stage
          max_fires: null
          deadline: 1h
          expiry:
            - {transition: T-expire}
            - {wait: again, if: {counter: other_expiries, lt: {cap: expiries_before_escalation}}}
            - {wait: again, if: {counter: started_expiries, lt: {cap: expiries_before_escalation}}}
          require: []
      transitions:
        - {id: T-start, from: planned, to: exited, kind: started, 'on': message, guard: '-', require: [], effects: [{count: other_expiries}]}
        - {id: T-expire, from: planned, to: planned, kind: started, 'on': expiry, guard: '-', require: [], effects: [{count: started_expiries}]}
    expect:
      failures: ["started: {wait: again}'s if is not lt a cap on a counter an on: expiry transition of the kind moves"]
  - name: a profile that is not one of autonomy_profiles is reported
    given:
      profile: supervisd
      autonomy_profiles: {supervised: {merge: C}, assisted: {merge: A}}
      transitions:
        - {id: T-start, from: planned, to: exited, kind: started, 'on': message, guard: '-', require: [], effects: []}
    expect:
      failures: ["profile 'supervisd' is not in autonomy_profiles"]
  - name: a kind with max_fires null is capped by caps.max_fires_default, in the walker too
    given:
      caps: {max_fires_default: 1}
      states: {planned: {bora_gate: true}, exited: {terminal: true}}
      transitions:
        - {id: T-again, from: planned, to: planned, kind: started, 'on': message, guard: '-', require: [], effects: []}
      walks:
        - name: the second started is past the default cap
          initial: planned
          steps:
            - {who: coder, kind: started, args: {}}
            - {who: coder, kind: started, args: {}, expect: {refused: true, refusal_contains: cap exhausted, refused_by: started}}
          final: planned
    expect:
      output: ["ok   walk the second started is past the default cap reached planned"]
