# Stage lifecycle and five companion machines — executable contracts §4.
version: 1
states:
  planned:
    desc: in the plan, not proposed
    terminal: false
  proposed:
    desc: TeamLead proposed an assignment; Bora's gate (or the pre-approved queue)
    bora_gate: true
  assigned:
    desc: approved; seat bound; coder not yet started
  building:
    desc: the coder executes the list
  stopped:
    desc: a fence stop condition was named; Principal triages
  candidate_deployed:
    desc: 'U-1: QA verified the candidate on the live target before review (stages with a live DONE only)'
  ready_for_review:
    desc: PR ready, CI green; waiting for the reviewer binding
  in_review:
    desc: full review (R5.1)
  fix_round:
    desc: autonomous fix round 1 or 2 (counter in context)
  re_review:
    desc: per-open-blocker re-review only (R5.3 second half)
  grant_pending:
    desc: a third FIX FIRST; the Principal may grant (D-23); entered at most once per stage (fix_rounds = 2)
  fix_round_3:
    desc: granted third round
  ruling_pending:
    desc: a fourth FIX FIRST; only Bora may rule (D-23)
    bora_gate: true
  fix_round_4:
    desc: Bora-ruled fourth round
  passed:
    desc: PASS or PASS — follow-ups filed
  merged:
    desc: on master (merge through the daemon, D-27 n)
  released:
    desc: 'image built / version tagged (skip if rolls: none)'
  deployed:
    desc: 'rolled and smoke-tested on the live target by QA (skip if live: none)'
  tail_failed:
    desc: merge, build or roll failed after the retry; Bora's gate (D-27 f)
    bora_gate: true
  frozen:
    desc: stray change at the merge audit; this stage only, seat paused (D-27 g)
    bora_gate: true
  exited:
    desc: STATUS, REGISTER, project committed+pushed; Found all triaged
    terminal: true
  recut:
    desc: back to the planner; Bora starts the Planner session (B)
    bora_gate: true
  closed:
    desc: PR closed, worktree freed after recut
    terminal: true
  paused:
    desc: seat gone while active (any active state); Pool Manager re-seats
    overlay: true
counters:
  proposals:
    scope: stage
  stops:
    scope: stage
  resumes:
    scope: stage
  review_requests:
    scope: stage
  fix_rounds:
    scope: stage
  seat_gone_events:
    scope: stage
  tail_retries:
    scope: stage
  refusals_per_seat:
    scope: seat
  merge_attempts:
    scope: stage
  release_attempts:
    scope: stage
  roll_attempts:
    scope: stage
  review_request_expiries:
    scope: stage
  repair_expiries:
    scope: stage
  review_bind_expiries:
    scope: stage
  rollbacks_completed:
    scope: stage
transitions:
- from: planned
  to: proposed
  kind: assignment-proposal
  guard: 'R4.8 predecessors exited (observed) · seat free (roster) · slots open (budgets) · fence has SC ids and a touches:
    line (observed)'
  id: T-01
  'on': message
  require:
  - fact: plan.predecessors_exited
  - fact: pool.seat_available
    role:
      arg: role
    level:
      arg: level
  - fact: budget.slot_open
    dimension: office
  - fact: budget.slot_open
    dimension: subscription
  - fact: budget.slot_open
    dimension: effort
  - fact: list.fence_complete
  effects:
  - count: proposals
- from: proposed
  to: proposed
  kind: approval
  guard: signed by Bora's CLI
  id: T-02
  'on': message
  require:
  - signed: bora
  effects:
  - do: worktree.create
    with:
      stage:
        msg: stage
- from: proposed
  to: assigned
  kind: approval
  guard: signed by Bora's CLI
  id: T-03
  'on': op-result
  require:
  - op: worktree.create
    eq: ok
  effects: []
- from: proposed
  to: proposed
  kind: queued-approval
  guard: 'from the Deputy while Bora is absent: the stage is in his signed queue for the current wave (robots/deputy.yaml
    DEP-2)'
  id: T-04
  'on': message
  require:
  - fact: bora.present
    eq: false
  - fact: queue.names
  - fact: stage.cut_at
    lte:
      fact: bora.absent_since
  effects:
  - do: worktree.create
    with:
      stage:
        msg: stage
- from: proposed
  to: assigned
  kind: queued-approval
  guard: 'from the Deputy while Bora is absent: the stage is in his signed queue for the current wave (robots/deputy.yaml
    DEP-2)'
  id: T-05
  'on': op-result
  require:
  - op: worktree.create
    eq: ok
  effects: []
- from: proposed
  to: planned
  kind: decline
  guard: signed by Bora's CLI; or deadline expired (counter proposals ≤ 2, then Principal ping)
  id: T-06
  'on': message
  require:
  - signed: bora
  effects: []
- from: proposed
  to: planned
  kind: assignment-proposal
  guard: signed by Bora's CLI; or deadline expired (counter proposals ≤ 2, then Principal ping)
  id: T-07
  'on': expiry
  require: []
  effects:
  - emit: nudge
    to: principal
    if:
      counter: proposals
      gte:
        cap: proposals_per_stage
- from: assigned
  to: building
  kind: started
  guard: branch off master exists (observed)
  id: T-08
  'on': message
  require:
  - fact: git.branch_exists
  effects: []
- from: building
  to: stopped
  kind: stop
  guard: names a stop-condition id from the fence (SC-n) · counter stops
  id: T-09
  'on': message
  require:
  - arg: sc
    in:
      fact: list.stop_conditions
  effects:
  - count: stops
- from: fix_round
  to: stopped
  kind: stop
  guard: as above (RV-8)
  id: T-10
  'on': message
  require:
  - arg: sc
    in:
      fact: list.stop_conditions
  effects:
  - count: stops
- from: fix_round_3
  to: stopped
  kind: stop
  guard: as above
  id: T-11
  'on': message
  require:
  - arg: sc
    in:
      fact: list.stop_conditions
  effects:
  - count: stops
- from: fix_round_4
  to: stopped
  kind: stop
  guard: as above
  id: T-12
  'on': message
  require:
  - arg: sc
    in:
      fact: list.stop_conditions
  effects:
  - count: stops
- from: stopped
  to: building
  kind: triage
  guard: outcome=resume · task-count diff within R4.11 · no edit outside the Found section (observed) · counter resumes ≤
    2, the 3rd needs Bora
  id: T-13
  'on': message
  require:
  - arg: outcome
    eq: resume
  - fact: list.tasks_total
    gte:
      cap: stage_tasks_min
  - fact: list.tasks_total
    lte:
      cap: stage_tasks_max
  - fact: list.sections_changed
    since:
      arg: since
    in:
    - Found while doing
  - counter: resumes
    lt:
      cap: resumes_per_stage
  effects:
  - count: resumes
- from: stopped
  to: recut
  kind: triage
  guard: 'outcome=recut (class B: Bora is the gate, D-27 b)'
  id: T-14
  'on': message
  require:
  - arg: outcome
    eq: recut
  effects: []
- from: building
  to: candidate_deployed
  kind: qa-report
  guard: 'outcome=pass on a qa-request for a live task · stage live: ≠ none · fixture saved · temp pods dropped (observed)
    (U-1, D-31)'
  id: T-15
  'on': message
  require:
  - arg: outcome
    eq: pass
  - re: kind
    eq: qa-request
  - fact: stage.live
    ne: none
  - fact: fixture.exists
    pointer:
      arg: fixture
  - fact: live.namespace_absent
    stage:
      msg: stage
  effects: []
- from: candidate_deployed
  to: ready_for_review
  kind: review-request
  guard: see below
  id: T-16
  'on': message
  require:
  - &id001
    fact: pr.ready
  - &id002
    fact: ci.state
    of:
      fact: pr.head
    eq: green
  - &id003
    fact: list.tasks_open
    eq: 0
  - &id004
    attest: done_lines_hold
  - &id005
    counter: review_requests
    lt:
      cap: review_requests_per_stage
  effects:
  - &id006
    count: review_requests
  - &id007
    emit: found-batch
    to: principal
    if:
      fact: list.found_untriaged
      gt: 0
- from: building
  to: ready_for_review
  kind: review-request
  guard: PR ready (observed) · CI green on head (observed) · every task ticked with done <sha> (observed) · DONE lines ticked
    (attested) · fans out found-batch · counter review_requests ≤ 3
  id: T-17
  'on': message
  require:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  effects:
  - *id006
  - *id007
- from: ready_for_review
  to: in_review
  kind: review-bind
  guard: reviewer seat ≠ coder seat · roster rank(reviewer) ≥ rank(coder) · reviewer model ≥ roster review floor (D-45)
  id: T-18
  'on': message
  require:
  - fact: seat.name
    of:
      arg: reviewer
    ne:
      fact: seat.name
      of: coder
  - fact: roster.rank
    of:
      arg: reviewer
    gte:
      fact: roster.rank
      of: coder
  - fact: roster.model_rank
    of:
      arg: reviewer
    gte:
      fact: roster.floor_rank
  effects: []
- from: in_review
  to: passed
  kind: verdict
  guard: verdict ∈ {PASS, PASS-FU} · a GitHub PR review exists on the same head sha (observed, R6.2)
  id: T-19
  'on': message
  require:
  - arg: verdict
    in:
    - PASS
    - PASS-FU
  - fact: pr.review_on
    sha:
      fact: pr.head
    in:
    - approved
    - commented
  effects:
  - do: issue.file
    with:
      follow_ups:
        arg: follow_ups
    if:
      arg: follow_ups
- from: in_review
  to: fix_round
  kind: verdict
  guard: verdict = FIX FIRST · blockers with ids · counter fix_rounds < 2
  id: T-20
  'on': message
  require:
  - arg: verdict
    eq: FIX FIRST
  - arg: blockers
  - counter: fix_rounds
    lt:
      cap: fix_rounds_autonomous
  effects:
  - count: fix_rounds
  - do: issue.file
    with:
      follow_ups:
        arg: follow_ups
    if:
      arg: follow_ups
- from: re_review
  to: fix_round
  kind: re-verdict
  guard: blockers remain · counter fix_rounds < 2
  id: T-21
  'on': message
  require:
  - arg: verdict
    eq: FIX FIRST
  - arg: blockers
  - counter: fix_rounds
    lt:
      cap: fix_rounds_autonomous
  effects:
  - count: fix_rounds
  - do: issue.file
    with:
      follow_ups:
        arg: follow_ups
    if:
      arg: follow_ups
- from: fix_round
  to: re_review
  kind: repair-done
  guard: new commits since the verdict (observed) · CI green (observed) · one response line per blocker id (observed)
  id: T-22
  'on': message
  require:
  - &id008
    fact: pr.commits_since
    message:
      arg: verdict
    gt: 0
  - &id009
    fact: ci.state
    of:
      fact: pr.head
    eq: green
  - &id010
    fact: pr.blocker_responses
    ids:
      fact: review.open_blockers
    eq:
      fact: review.open_blockers
  effects: []
- from: re_review
  to: passed
  kind: re-verdict
  guard: per open blocker only · PASS
  id: T-23
  'on': message
  require:
  - arg: verdict
    in:
    - PASS
    - PASS-FU
  - arg: blockers
    eq: []
  effects:
  - do: issue.file
    with:
      follow_ups:
        arg: follow_ups
    if:
      arg: follow_ups
- from: re_review
  to: grant_pending
  kind: re-verdict
  guard: blockers remain · counter fix_rounds = 2 → the mailroom emits grant-request to the Principal
  id: T-24
  'on': message
  require:
  - arg: verdict
    eq: FIX FIRST
  - arg: blockers
  - counter: fix_rounds
    eq:
      cap: fix_rounds_autonomous
  effects:
  - emit: grant-request
    to: principal
  - do: issue.file
    with:
      follow_ups:
        arg: follow_ups
    if:
      arg: follow_ups
- from: grant_pending
  to: fix_round_3
  kind: grant
  guard: from the Principal · within deadline
  id: T-25
  'on': message
  require:
  - arg: outcome
    eq: grant
  effects:
  - count: fix_rounds
- from: grant_pending
  to: recut
  kind: grant
  guard: refused, or deadline expired
  id: T-26
  'on': message
  require:
  - arg: outcome
    eq: refuse
  effects: []
- from: grant_pending
  to: recut
  kind: grant-request
  guard: refused, or deadline expired
  id: T-27
  'on': expiry
  require: []
  effects: []
- from: fix_round_3
  to: re_review
  kind: repair-done
  guard: as above
  id: T-28
  'on': message
  require:
  - *id008
  - *id009
  - *id010
  effects: []
- from: re_review
  to: ruling_pending
  kind: re-verdict
  guard: blockers remain after round 3 → the mailroom emits ruling-request to Bora
  id: T-29
  'on': message
  require:
  - arg: verdict
    eq: FIX FIRST
  - arg: blockers
  - counter: fix_rounds
    eq:
      cap: fix_rounds_with_principal_grant
  effects:
  - emit: ruling-request
    to: bora
  - do: issue.file
    with:
      follow_ups:
        arg: follow_ups
    if:
      arg: follow_ups
- from: ruling_pending
  to: fix_round_4
  kind: ruling
  guard: from Bora's CLI · outcome=grant
  id: T-30
  'on': message
  require:
  - signed: bora
  - arg: outcome
    eq: grant
  effects:
  - count: fix_rounds
- from: ruling_pending
  to: recut
  kind: ruling
  guard: outcome=recut, or deadline expired (held while absent, D-28)
  id: T-31
  'on': message
  require:
  - signed: bora
  - arg: outcome
    eq: recut
  effects: []
- from: ruling_pending
  to: recut
  kind: ruling-request
  guard: outcome=recut, or deadline expired (held while absent, D-28)
  id: T-32
  'on': expiry
  require:
  - fact: bora.present
  effects: []
- from: fix_round_4
  to: re_review
  kind: repair-done
  guard: as above
  id: T-33
  'on': message
  require:
  - *id008
  - *id009
  - *id010
  effects: []
- from: re_review
  to: recut
  kind: re-verdict
  guard: blockers remain after round 4
  id: T-34
  'on': message
  require:
  - arg: verdict
    eq: FIX FIRST
  - arg: blockers
  - counter: fix_rounds
    gte:
      cap: fix_rounds_with_bora_ruling
  effects:
  - do: issue.file
    with:
      follow_ups:
        arg: follow_ups
    if:
      arg: follow_ups
- from: passed
  to: passed
  kind: merge
  guard: 'while Bora is absent the Deputy holds it (DEP-3) · second key: different reviewer seat · reviewer rank ≥ coder rank
    · reviewer model ≥ review floor else class B (D-45) · audit (observed): evidence lines present · list fully ticked · no
    proof files · every Found line triaged · no stray changes in main checkouts/sibling repos (D-19 c) · counter tail_retries
    ≤ 1'
  id: T-35
  'on': message
  require:
  - fact: bora.present
  - fact: pr.evidence_present
  - fact: list.tasks_open
    eq: 0
  - fact: project.proof_files
    eq: 0
  - fact: list.found_untriaged
    eq: 0
  - fact: git.stray_changes
    eq: 0
  - counter: merge_attempts
    lte:
      cap: tail_retries
  effects:
  - count: merge_attempts
  - do: git.merge
    with:
      stage:
        msg: stage
- from: passed
  to: merged
  kind: merge
  guard: 'while Bora is absent the Deputy holds it (DEP-3) · second key: different reviewer seat · reviewer rank ≥ coder rank
    · reviewer model ≥ review floor else class B (D-45) · audit (observed): evidence lines present · list fully ticked · no
    proof files · every Found line triaged · no stray changes in main checkouts/sibling repos (D-19 c) · counter tail_retries
    ≤ 1'
  id: T-36
  'on': op-result
  require:
  - op: git.merge
    eq: ok
  effects: []
- from: passed
  to: passed
  kind: merge
  guard: 'while Bora is absent the Deputy holds it (DEP-3) · second key: different reviewer seat · reviewer rank ≥ coder rank
    · reviewer model ≥ review floor else class B (D-45) · audit (observed): evidence lines present · list fully ticked · no
    proof files · every Found line triaged · no stray changes in main checkouts/sibling repos (D-19 c) · counter tail_retries
    ≤ 1'
  id: T-37
  'on': op-result
  require:
  - op: git.merge
    eq: failed
  - counter: merge_attempts
    lte:
      cap: tail_retries
  effects: []
- from: passed
  to: frozen
  kind: merge
  guard: audit found a stray change → this stage frozen, coder seat paused (D-27 g)
  id: T-38
  'on': message
  require:
  - fact: git.stray_changes
    gt: 0
  effects: []
- from: passed
  to: tail_failed
  kind: merge
  guard: merge failed twice (conflict, stale CI)
  id: T-39
  'on': op-result
  require:
  - op: git.merge
    eq: failed
  - counter: merge_attempts
    gt:
      cap: tail_retries
  effects: []
- from: merged
  to: merged
  kind: release
  guard: 'stage rolls: ≠ none · image built, version tagged · counter tail_retries ≤ 1'
  id: T-40
  'on': message
  require:
  - fact: stage.rolls
    ne: none
  - counter: release_attempts
    lte:
      cap: tail_retries
  effects:
  - count: release_attempts
  - do: release.build
    with:
      stage:
        msg: stage
- from: merged
  to: merged
  kind: release
  guard: 'stage rolls: ≠ none · image built, version tagged · counter tail_retries ≤ 1'
  id: T-41
  'on': op-result
  require:
  - op: release.build
    eq: ok
  effects:
  - do: tag.create
    with:
      stage:
        msg: stage
- from: merged
  to: released
  kind: release
  guard: 'stage rolls: ≠ none · image built, version tagged · counter tail_retries ≤ 1'
  id: T-42
  'on': op-result
  require:
  - op: tag.create
    eq: ok
  effects: []
- from: merged
  to: merged
  kind: release
  guard: 'stage rolls: ≠ none · image built, version tagged · counter tail_retries ≤ 1'
  id: T-43
  'on': op-result
  require:
  - any:
    - op: release.build
      eq: failed
    - op: tag.create
      eq: failed
  - counter: release_attempts
    lte:
      cap: tail_retries
  effects: []
- from: merged
  to: merged
  kind: stage-exit
  guard: 'stage rolls: none and (live: none or live DONE verified on the candidate head sha) · exit guard below (D-42)'
  id: T-44
  'on': message
  require:
  - &id011
    fact: status.entry_present
  - &id012
    fact: status.entries
    lte:
      cap: status_entries
  - &id013
    fact: list.found_untriaged
    eq: 0
  - fact: stage.rolls
    eq: none
  - any:
    - fact: stage.live
      eq: none
    - fact: log.count
      kind: qa-report
      scope: stage
      where:
        outcome: pass
        sha:
          fact: pr.head
      gt: 0
  effects:
  - do: worktree.remove
    with:
      stage:
        msg: stage
- from: merged
  to: exited
  kind: stage-exit
  guard: 'stage rolls: none and (live: none or live DONE verified on the candidate head sha) · exit guard below (D-42)'
  id: T-45
  'on': op-result
  require:
  - op: project.commit_push
    eq: ok
  effects: []
- from: merged
  to: tail_failed
  kind: release
  guard: build failed twice
  id: T-46
  'on': op-result
  require:
  - any:
    - op: release.build
      eq: failed
    - op: tag.create
      eq: failed
  - counter: release_attempts
    gt:
      cap: tail_retries
  effects: []
- from: released
  to: deployed
  kind: deploy-done
  guard: 'QA: rollout complete (observed) · smoke passed · on the TeamLead''s deploy-request · Bora present'
  id: T-47
  'on': message
  require:
  - fact: live.rollout_complete
    target:
      fact: stage.live
    pin:
      arg: pin
  - arg: smoke
    eq: pass
  - re: kind
    eq: deploy-request
  - fact: bora.present
  effects: []
- from: released
  to: released
  kind: stage-exit
  guard: 'stage live: none · exit guard below'
  id: T-48
  'on': message
  require:
  - *id011
  - *id012
  - *id013
  - fact: stage.live
    eq: none
  effects:
  - do: worktree.remove
    with:
      stage:
        msg: stage
- from: released
  to: exited
  kind: stage-exit
  guard: 'stage live: none · exit guard below'
  id: T-49
  'on': op-result
  require:
  - op: project.commit_push
    eq: ok
  effects: []
- from: released
  to: tail_failed
  kind: deploy-failed
  guard: 'QA: roll or smoke failed · rolled back to the previous pin by QA (D-31)'
  id: T-50
  'on': message
  require:
  - arg: outcome
    eq: fail
  - arg: rollback
    eq: ok
  - counter: rollbacks_completed
    gt: 0
  effects: []
- from: deployed
  to: deployed
  kind: stage-exit
  guard: STATUS per R4.9 (observed) · REGISTER rebuilt · project committed and pushed (D-27 m) · every Found line triaged
    (RV-29)
  id: T-51
  'on': message
  require:
  - *id011
  - *id012
  - *id013
  effects:
  - do: worktree.remove
    with:
      stage:
        msg: stage
- from: deployed
  to: exited
  kind: stage-exit
  guard: STATUS per R4.9 (observed) · REGISTER rebuilt · project committed and pushed (D-27 m) · every Found line triaged
    (RV-29)
  id: T-52
  'on': op-result
  require:
  - op: project.commit_push
    eq: ok
  effects: []
- from: tail_failed
  to: merged
  kind: ruling
  guard: 'Bora: retry (after a fix)'
  id: T-53
  'on': message
  require:
  - signed: bora
  - arg: outcome
    eq: retry
  effects: []
- from: tail_failed
  to: recut
  kind: ruling
  guard: 'Bora: recut'
  id: T-54
  'on': message
  require:
  - signed: bora
  - arg: outcome
    eq: recut
  effects: []
- from: frozen
  to: passed
  kind: ruling
  guard: 'Bora: cleared (stray change explained/removed)'
  id: T-55
  'on': message
  require:
  - signed: bora
  - arg: outcome
    eq: cleared
  effects: []
- from: frozen
  to: recut
  kind: ruling
  guard: 'Bora: recut'
  id: T-56
  'on': message
  require:
  - signed: bora
  - arg: outcome
    eq: recut
  effects: []
- from: recut
  to: recut
  kind: close
  guard: PR closed · worktree freed (daemon) · recut-notice sent to Bora
  id: T-57
