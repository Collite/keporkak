# Keporkak — the stage lifecycle (P-5c). Source of truth for the mailroom's guard (D-9, D-21).
# A transition is fired by exactly one message kind (see message-kinds.yaml); anything else is refused.
# Guards: `observed` = the daemon checks the world (CI, files, roster); `attested` = the sender asserts, logged as such (RV-13).
# Converged 2026-11-12 from 07 (P-5/P-5b), review-261112-c2 (RV-n, U-n), D-20…D-28.
version: 1
states:
  planned:            {desc: "in the plan, not proposed", terminal: false}
  proposed:           {desc: "TeamLead proposed an assignment; Bora's gate (or the pre-approved queue)", bora_gate: true}
  assigned:           {desc: "approved; seat bound; coder not yet started"}
  building:           {desc: "the coder executes the list"}
  stopped:            {desc: "a fence stop condition was named; Principal triages"}
  candidate_deployed: {desc: "U-1: QA verified the candidate on the live target before review (stages with a live DONE only)"}
  ready_for_review:   {desc: "PR ready, CI green; waiting for the reviewer binding"}
  in_review:          {desc: "full review (R5.1)"}
  fix_round:          {desc: "autonomous fix round 1 or 2 (counter in context)"}
  re_review:          {desc: "per-open-blocker re-review only (R5.3 second half)"}
  grant_pending:      {desc: "a third FIX FIRST; the Principal may grant (D-23); entered at most once per stage (fix_rounds = 2)"}
  fix_round_3:        {desc: "granted third round"}
  ruling_pending:     {desc: "a fourth FIX FIRST; only Bora may rule (D-23)", bora_gate: true}
  fix_round_4:        {desc: "Bora-ruled fourth round"}
  passed:             {desc: "PASS or PASS — follow-ups filed"}
  merged:             {desc: "on master (merge through the daemon, D-27 n)"}
  released:           {desc: "image built / version tagged (skip if rolls: none)"}
  deployed:           {desc: "rolled and smoke-tested on the live target by QA (skip if live: none)"}
  tail_failed:        {desc: "merge, build or roll failed after the retry; Bora's gate (D-27 f)", bora_gate: true}
  frozen:             {desc: "stray change at the merge audit; this stage only, seat paused (D-27 g)", bora_gate: true}
  exited:             {desc: "STATUS, REGISTER, project committed+pushed; Found all triaged", terminal: true}
  recut:              {desc: "back to the planner; Bora starts the Planner session (B)", bora_gate: true}
  closed:             {desc: "PR closed, worktree freed after recut", terminal: true}
  paused:             {desc: "seat gone while active (any active state); Pool Manager re-seats", overlay: true}

# Context counters the mailroom keeps per stage (caps come from engagement.yaml:caps unless stated)
counters: [proposals, stops, resumes, review_requests, fix_rounds, seat_gone_events, tail_retries, refusals_per_seat]

transitions:
  - {from: planned,            to: proposed,           kind: assignment-proposal, guard: "R4.8 predecessors exited (observed) · seat free (roster) · slots open (budgets) · fence has SC ids and a touches: line (observed)"}
  - {from: proposed,           to: assigned,           kind: approval,            guard: "signed by Bora's CLI"}
  - {from: proposed,           to: assigned,           kind: queued-approval,     guard: "from the Deputy while Bora is absent: the stage is in his signed queue for the current wave (robots/deputy.yaml DEP-2)"}
  - {from: proposed,           to: planned,            kind: decline,             guard: "signed by Bora's CLI; or deadline expired (counter proposals ≤ 2, then Principal ping)"}
  - {from: assigned,           to: building,           kind: started,             guard: "branch off master exists (observed)"}
  - {from: building,           to: stopped,            kind: stop,                guard: "names a stop-condition id from the fence (SC-n) · counter stops"}
  - {from: fix_round,          to: stopped,            kind: stop,                guard: "as above (RV-8)"}
  - {from: fix_round_3,        to: stopped,            kind: stop,                guard: "as above"}
  - {from: fix_round_4,        to: stopped,            kind: stop,                guard: "as above"}
  - {from: stopped,            to: building,           kind: triage,              guard: "outcome=resume · task-count diff within R4.11 · no edit outside the Found section (observed) · counter resumes ≤ 2, the 3rd needs Bora"}
  - {from: stopped,            to: recut,              kind: triage,              guard: "outcome=recut (class B: Bora is the gate, D-27 b)"}
  - {from: building,           to: candidate_deployed, kind: qa-report,           guard: "outcome=pass on a qa-request for a live task · stage live: ≠ none · fixture saved · temp pods dropped (observed) (U-1, D-31)"}
  - {from: candidate_deployed, to: ready_for_review,   kind: review-request,      guard: "see below"}
  - {from: building,           to: ready_for_review,   kind: review-request,      guard: "PR ready (observed) · CI green on head (observed) · every task ticked with done <sha> (observed) · DONE lines ticked (attested) · fans out found-batch · counter review_requests ≤ 3"}
  - {from: ready_for_review,   to: in_review,          kind: review-bind,         guard: "reviewer seat ≠ coder seat · roster rank(reviewer) ≥ rank(coder) · vendor ≠ coder's vendor preferred (required later for autonomous merge, U-6)"}
  - {from: in_review,          to: passed,             kind: verdict,             guard: "verdict ∈ {PASS, PASS-FU} · a GitHub PR review exists on the same head sha (observed, R6.2)"}
  - {from: in_review,          to: fix_round,          kind: verdict,             guard: "verdict = FIX FIRST · blockers with ids · counter fix_rounds < 2"}
  - {from: re_review,          to: fix_round,          kind: re-verdict,          guard: "blockers remain · counter fix_rounds < 2"}
  - {from: fix_round,          to: re_review,          kind: repair-done,         guard: "new commits since the verdict (observed) · CI green (observed) · one response line per blocker id (observed)"}
  - {from: re_review,          to: passed,             kind: re-verdict,          guard: "per open blocker only · PASS"}
  - {from: re_review,          to: grant_pending,      kind: re-verdict,          guard: "blockers remain · counter fix_rounds = 2 → the mailroom emits grant-request to the Principal"}
  - {from: grant_pending,      to: fix_round_3,        kind: grant,               guard: "from the Principal · within deadline"}
  - {from: grant_pending,      to: recut,              kind: grant,               guard: "refused, or deadline expired"}
  - {from: fix_round_3,        to: re_review,          kind: repair-done,         guard: "as above"}
  - {from: re_review,          to: ruling_pending,     kind: re-verdict,          guard: "blockers remain after round 3 → the mailroom emits ruling-request to Bora"}
  - {from: ruling_pending,     to: fix_round_4,        kind: ruling,              guard: "from Bora's CLI · outcome=grant"}
  - {from: ruling_pending,     to: recut,              kind: ruling,              guard: "outcome=recut, or deadline expired (held while absent, D-28)"}
  - {from: fix_round_4,        to: re_review,          kind: repair-done,         guard: "as above"}
  - {from: re_review,          to: recut,              kind: re-verdict,          guard: "blockers remain after round 4"}
  - {from: passed,             to: merged,             kind: merge,               guard: "while Bora is absent the Deputy holds it (DEP-3) · second key: reviewer vendor ≠ coder vendor else class B (U-6) · audit (observed): evidence lines present · list fully ticked · no proof files · every Found line triaged · no stray changes in main checkouts/sibling repos (D-19 c) · counter tail_retries ≤ 1"}
  - {from: passed,             to: frozen,             kind: merge,               guard: "audit found a stray change → this stage frozen, coder seat paused (D-27 g)"}
  - {from: passed,             to: tail_failed,        kind: merge,               guard: "merge failed twice (conflict, stale CI)"}
  - {from: merged,             to: released,           kind: release,             guard: "stage rolls: ≠ none · image built, version tagged · counter tail_retries ≤ 1"}
  - {from: merged,             to: exited,             kind: stage-exit,          guard: "stage rolls: none and live: none · exit guard below"}
  - {from: merged,             to: tail_failed,        kind: release,             guard: "build failed twice"}
  - {from: released,           to: deployed,           kind: deploy-done,         guard: "QA: rollout complete (observed) · smoke passed · on the TeamLead's deploy-request · Bora present"}
  - {from: released,           to: exited,             kind: stage-exit,          guard: "stage live: none · exit guard below"}
  - {from: released,           to: tail_failed,        kind: deploy-failed,       guard: "QA: roll or smoke failed · rolled back to the previous pin by QA (D-31)"}
  - {from: deployed,           to: exited,             kind: stage-exit,          guard: "STATUS per R4.9 (observed) · REGISTER rebuilt · project committed and pushed (D-27 m) · every Found line triaged (RV-29)"}
  - {from: tail_failed,        to: merged,             kind: ruling,              guard: "Bora: retry (after a fix)"}
  - {from: tail_failed,        to: recut,              kind: ruling,              guard: "Bora: recut"}
  - {from: frozen,             to: passed,             kind: ruling,              guard: "Bora: cleared (stray change explained/removed)"}
  - {from: frozen,             to: recut,              kind: ruling,              guard: "Bora: recut"}
  - {from: recut,              to: closed,             kind: close,               guard: "PR closed · worktree freed (daemon) · recut-notice sent to Bora"}
  # overlay: the seat lifecycle hits the stage
  - {from: "*active",          to: paused,             kind: seat-gone,           guard: "pid/pty gone or ACP protocol closed (observed) · an open in_progress tool call counts as busy, not gone · counter seat_gone_events ≤ 3 per stage, then pause for Bora"}
  - {from: paused,             to: "*previous",        kind: re-seated,           guard: "fresh seat with the list, STATUS and the unread inbox replayed · class C after the 2nd re-seat"}

active_states: [assigned, building, stopped, candidate_deployed, ready_for_review, in_review, fix_round, re_review, grant_pending, fix_round_3, ruling_pending, fix_round_4, passed, merged, released]

# The two sub-machines and the two companion machines (converged in 11-c2-converged.md; kept here for the validator)
found_item:
  states: [found, triaged]
  transitions:
    - {from: found, to: triaged, kind: triage, guard: "outcome ∈ {resume, issue, stage, drop}; `issue` → Gardener (D-14), `stage` → Planner via Bora"}
flag_thread:
  states: [asked, held, ruled, expired]
  transitions:
    - {from: asked,  to: ruled,   kind: ruling,  guard: "from Bora's CLI"}
    - {from: asked,  to: held,    kind: hold,    guard: "Bora absent (D-28); listed in the digest"}
    - {from: held,   to: ruled,   kind: ruling,  guard: "from Bora's CLI"}
    - {from: asked,  to: expired, kind: expire,  guard: "deadline passed while present; reported, never auto-resolved; one open thread per (stage, subject)"}
seat:
  states: [provisioned, ready, busy, idle, gone, retired]
  transitions:
    - {from: provisioned, to: ready,   kind: session-report, guard: "handshake ok, MCP injected, identity bound"}
    - {from: ready,       to: busy,    kind: assign,         guard: "a stage assigned"}
    - {from: busy,        to: idle,    kind: stage-exit,     guard: "or close"}
    - {from: "*",         to: gone,    kind: seat-gone,      guard: "observed by the Pool Manager"}
    - {from: gone,        to: ready,   kind: re-seated,      guard: "≤ 3 events per stage"}
    - {from: "*",         to: retired, kind: retire,         guard: "TeamLead's session-request to remove, or budget cap (C)"}
phase:
  states: [open, exit_pending, exited]
  transitions:
    - {from: open,         to: exit_pending, kind: phase-exit-request, guard: "last stage of the last wave exited · chart refreshed (R3) · STATUS rolled over (R4.9) · reader floor checked (R8) · retro-report delivered (D-13)"}
    - {from: exit_pending, to: exited,       kind: approval,           guard: "Bora (U-7: class B)"}
presence:
  states: [present, absent]
  transitions:
    - {from: present, to: absent,  kind: away,     guard: "no action from Bora's CLI for N hours (default 4), or `kp away`"}
    - {from: absent,  to: present, kind: presence, guard: "any action from Bora's CLI → digest delivered"}
