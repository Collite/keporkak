phase:
  states:
  - open
  - exit_pending
  - exited
  transitions:
  - from: open
    to: exit_pending
    kind: phase-exit-request
    guard: last stage of the last wave exited · chart refreshed (R3) · STATUS rolled over (R4.9) · reader floor checked (R8)
      · retro-report delivered (D-13)
    id: PHASE-01
    'on': message
    require:
    - fact: plan.last_stage_exited
    - fact: plan.chart_fresh
    - fact: status.entries
      lte:
        cap: status_entries
    - attest: floors_checked
    - fact: log.count
      kind: retro-report
      scope: phase
      where:
        mode: phase-retro
      gt: 0
    effects: []
  - from: exit_pending
    to: exit_pending
    kind: approval
    guard: 'Bora (U-7: class B)'
    id: PHASE-02
    'on': message
    require:
    - signed: bora
    effects:
    - do: register.rebuild
      with: {}
  - from: exit_pending
    to: exited
    kind: approval
    guard: 'Bora (U-7: class B)'
    id: PHASE-03
    'on': op-result
    require:
    - op: project.commit_push
      eq: ok
    effects: []
  - from: exit_pending
    to: exit_pending
    kind: approval
    guard: 'Bora (U-7: class B)'
    id: PHASE-04
    'on': op-result
    require:
    - op: register.rebuild
      eq: ok
    effects:
    - do: project.commit_push
      with: {}
presence:
  states:
  - present
  - absent
  transitions:
  - from: present
    to: absent
    kind: away
    guard: no action from Bora's CLI for N hours (default 4), or `kp away`
    id: PRESENCE-01
    'on': message
    require:
    - signed: bora
    effects: []
  - from: present
    to: absent
    guard: no action from Bora's CLI for N hours (default 4), or `kp away`
    id: PRESENCE-02
    'on': fact
    require:
    - fact: bora.idle_for
      gte:
        engagement: presence.idle_hours_to_absent
    effects: []
  - from: absent
    to: present
    guard: any action from Bora's CLI → digest delivered
    id: PRESENCE-03
    'on': fact
    require:
    - fact: bora.acted
    effects: []
