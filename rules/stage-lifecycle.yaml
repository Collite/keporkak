found_item:
  states:
  - found
  - triaged
  transitions:
  - from: found
    to: triaged
    kind: triage
    guard: outcome ∈ {resume, issue, stage, drop}; `issue` → Gardener (D-14), `stage` → Planner via Bora
    id: FOUND_ITEM-01
    'on': message
    require:
    - arg: outcome
      in:
      - resume
      - issue
      - stage
      - drop
    effects:
    - do: issue.file
      with:
        found:
          arg: found
      if:
        arg: outcome
