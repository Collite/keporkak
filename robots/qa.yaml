# QA robot — queue discipline and persona-only browser decisions (contracts §8).
role: qa
active_when:
  always: true
intercepts: []
rules:
- id: QA-3
  for: persona
  when: a job can be done with a scripted browser (Playwright, QA's own profile)
  note: do it that way; no session is needed, on any office
- id: QA-4
  for: persona
  when: a job needs computer use and the office's class is B
  note: send computer-use-session and wait for the approval
- id: QA-5
  for: persona
  when: a job needs computer use and the office's class is off
  note: 'answer qa-report fail: ''computer use is not available in this office'''
queue:
  one_at_a_time: true
  order:
  - deploy-request
  - qa-request
  then: fifo
  next_when:
    fact: live.namespace_absent
  prose:
  - id: QA-1
    when: several requests wait
    note: 'take one at a time: deploy-request before qa-request, then first come first served'
  - id: QA-2
    when: a job ends
    note: the next job starts only after the temp pods and namespace of the last one are dropped
